[project]
name = "study-journey"
version = "0.2.0"
description = "Study Journey: four-year course planner for ZUEL undergraduates"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "flask>=3.1",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytailwindcss>=0.2",
]
# Only needed for importing school Excel files locally
importers = [
    "openpyxl>=3.1",
    "xlrd>=2.0",
]
# Cloudflare demo deployment
worker = [
    "workers-py",
    "workers-runtime-sdk",
]

[build-system]
requires = ["uv_build>=0.8,<0.14"]
build-backend = "uv_build"

[tool.uv]
# uv sync installs dev tools and Excel importers by default; add --group worker for Cloudflare
default-groups = ["dev", "importers"]

[tool.uv.build-backend]
module-name = "study_journey"
module-root = "src"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
