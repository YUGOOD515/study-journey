{% extends "base.html" %}
{% block title %}学旅：四年课程安排{% endblock %}
{% block content %}
{% include "_workspace.html" %}

<dialog id="course-dialog" class="m-auto w-[min(440px,calc(100vw-48px))] rounded-lg bg-surface p-0 text-ink shadow-xl">
  <form method="dialog" class="p-6">
    <div class="flex items-start justify-between gap-4">
      <h2 class="font-serif text-lg font-semibold" data-field="name"></h2>
      <button value="cancel" class="-mr-2 -mt-1 rounded-md px-2 py-1 text-ink-2 hover:bg-fill" aria-label="关闭"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></button>
    </div>
    <dl class="mt-4 grid grid-cols-[auto_1fr] gap-x-6 gap-y-2 text-sm">
      <dt class="text-ink-2">学分</dt><dd class="num" data-field="credits"></dd>
      <dt class="text-ink-2">性质</dt><dd data-field="nature"></dd>
      <dt class="text-ink-2">建议学期</dt><dd data-field="offered"></dd>
      <dt class="text-ink-2">状态</dt><dd data-field="status"></dd>
      <dt class="text-ink-2" data-show="score">成绩</dt><dd class="num" data-show="score" data-field="score"></dd>
    </dl>
    <p class="mt-4 rounded-md bg-fill px-3 py-2 text-xs text-gold" data-show="warning" data-field="warning"></p>
    <div data-show="move" class="mt-6">
      <p class="text-xs text-ink-2">安排到</p>
      <div class="mt-2 grid grid-cols-4 gap-2" data-field="terms"></div>
    </div>
    <p data-show="locked" class="mt-6 text-xs text-ink-2">这门课已有修读记录，学期不能调整。</p>
  </form>
</dialog>
{% endblock %}
{% block scripts %}
<script>window.PLAN = {currentTerm: {{ calendar.current_term }}, moveUrl: "{{ url_for('timeline.move') }}"};</script>
<script src="{{ url_for('static', filename='vendor/sortable.min.js') }}" defer></script>
<script src="{{ url_for('static', filename='js/timeline.js') }}" defer></script>
{% endblock %}
